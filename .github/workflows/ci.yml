name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olap
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: olap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olap" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OLAP_DSN: postgresql://olap@localhost:5432/olap
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run olap seed
      - run: uv run olap verify --report verification.json
